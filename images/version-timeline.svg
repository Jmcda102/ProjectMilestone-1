<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" font-family="Arial, Helvetica, sans-serif">
  <!-- Timeline of major HTTP versions -->
  <rect width="640" height="170" fill="#ffffff"/>
  <line x1="50" y1="80" x2="590" y2="80" stroke="#cfd8df" stroke-width="4" stroke-linecap="round"/>
  <line x1="70" y1="80" x2="560" y2="80" stroke="#0f5e6e" stroke-width="4"/>
  <g fill="#ffffff" stroke="#0f5e6e" stroke-width="4">
    <circle cx="70" cy="80" r="9"/><circle cx="190" cy="80" r="9"/><circle cx="310" cy="80" r="9"/><circle cx="430" cy="80" r="9"/>
  </g>
  <circle cx="560" cy="80" r="11" fill="#0f5e6e"/>
  <g text-anchor="middle" font-size="15" font-weight="bold" fill="#16222f">
    <text x="70" y="52">HTTP/0.9</text><text x="190" y="52">HTTP/1.0</text><text x="310" y="52">HTTP/1.1</text><text x="430" y="52">HTTP/2</text><text x="560" y="52">HTTP/3</text>
  </g>
  <g text-anchor="middle" font-size="14" fill="#5a6676">
    <text x="70" y="114">1991</text><text x="190" y="114">1996</text><text x="310" y="114">1997</text><text x="430" y="114">2015</text><text x="560" y="114">2022</text>
  </g>
  <text x="320" y="152" text-anchor="middle" font-size="13" fill="#5a6676">Each version kept the same basic idea but made delivery faster and more reliable.</text>
</svg>
